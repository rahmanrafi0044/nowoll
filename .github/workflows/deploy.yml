# ============================================================================
# Deploy to STAGING — step 47. Starts by itself when CI passes on main (after a
# PR is merged), or by hand: GitHub → Actions → "Deploy to staging" →
# "Run workflow" (type an older commit to roll staging back to it).
#
#   build    — builds the Docker images here on GitHub (not on the VPS) and
#              stores them in GitHub's image storage (ghcr.io), tagged with
#              the commit: API, 2 workers, and shop + admin for staging AND
#              production (their public addresses are baked in)
#   staging  — deploy-to.yml: migrations on the STAGING database, then the
#              staging API at https://<STAGING_API_DOMAIN>
#
# Production is never touched here. When staging looks right:
# Actions → "Promote to production" → "Run workflow" (promote.yml) puts the
# exact same images on production.
#
# OFF until the VPS is ready: set the repository variable DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables) and add the secrets
# listed in docs/deployment.md. Secrets are never printed in the logs.
# ============================================================================
name: Deploy to staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to deploy to staging (an older commit = rollback)'
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}${{ matrix.env && format(' ({0})', matrix.env) || '' }}
    # Only after a green CI run of a push to main (not a PR), or by hand — and
    # only once the deploy is switched on.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    strategy:
      # The images are independent; build them side by side. The shop and the
      # admin get one image per environment (step 48): their public addresses
      # are baked in at build time. So production's images are built now too —
      # "Promote to production" then reuses them instead of rebuilding.
      matrix:
        include:
          - image: api
          - image: order-worker
          - image: notification-worker
          - { image: storefront, env: staging }
          - { image: storefront, env: production }
          - { image: admin, env: staging }
          - { image: admin, env: production }
    env:
      IMAGE_PREFIX: ghcr.io/rahmanrafi0044/nowoll # ghcr.io names must be lowercase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push (skipped if this commit's image already exists — e.g. a rollback)
        env:
          NAME: ${{ matrix.image }}
          WEB_ENV: ${{ matrix.env }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
          # Public addresses for the shop / admin of that environment (repository
          # variables — docs/deployment.md). Public by design: they end up in
          # every visitor's browser. Never a secret here.
          SITE_DOMAIN: ${{ matrix.env == 'staging' && vars.STAGING_SITE_DOMAIN || vars.SITE_DOMAIN }}
          ADMIN_DOMAIN: ${{ matrix.env == 'staging' && vars.STAGING_ADMIN_DOMAIN || vars.ADMIN_DOMAIN }}
          API_DOMAIN: ${{ matrix.env == 'staging' && vars.STAGING_API_DOMAIN || vars.API_DOMAIN }}
          SUPABASE_URL: ${{ matrix.env == 'staging' && vars.STAGING_SUPABASE_URL || vars.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ matrix.env == 'staging' && vars.STAGING_SUPABASE_ANON_KEY || vars.PROD_SUPABASE_ANON_KEY }}
        run: |
          IMAGE="$IMAGE_PREFIX-$NAME${WEB_ENV:+-$WEB_ENV}"
          if docker manifest inspect "$IMAGE:$SHA" > /dev/null 2>&1; then
            echo "$IMAGE:$SHA already exists — not rebuilding."
            exit 0
          fi
          case "$NAME" in
            api) args=(-f infrastructure/docker/api.Dockerfile) ;;
            storefront | admin)
              for v in SITE_DOMAIN ADMIN_DOMAIN API_DOMAIN SUPABASE_URL SUPABASE_ANON_KEY; do
                [ -n "${!v}" ] || { echo "::error::The repository variable for $v ($WEB_ENV) is not set — docs/deployment.md"; exit 1; }
              done
              args=(-f infrastructure/docker/web.Dockerfile --build-arg "APP=$NAME"
                --build-arg "NEXT_PUBLIC_SITE_URL=https://$SITE_DOMAIN"
                --build-arg "NEXT_PUBLIC_ADMIN_URL=https://$ADMIN_DOMAIN"
                --build-arg "NEXT_PUBLIC_API_URL=https://$API_DOMAIN"
                --build-arg "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
                --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY") ;;
            *) args=(-f infrastructure/docker/worker.Dockerfile --build-arg "WORKER=$NAME") ;;
          esac
          docker buildx create --use --name nowoll > /dev/null
          # The layer cache lives next to the images (":buildcache"), so an
          # unchanged lockfile doesn't download every package again.
          docker buildx build "${args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            -t "$IMAGE:$SHA" --push .

  staging:
    name: Staging
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-to.yml
    with:
      environment: staging
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit

  # Shown instead when the deploy is switched off, so it's clear why nothing happened.
  disabled:
    name: Deploy is switched off
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Deploy is off. When the VPS is ready, set the repository variable DEPLOY_ENABLED=true (docs/deployment.md)."
