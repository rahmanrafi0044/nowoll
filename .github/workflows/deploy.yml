# ============================================================================
# Deploy to STAGING — step 47. Starts by itself when CI passes on main (after a
# PR is merged), or by hand: GitHub → Actions → "Deploy to staging" →
# "Run workflow" (type an older commit to roll staging back to it).
#
#   build    — builds the 3 Docker images here on GitHub (not on the small
#              VPS) and stores them in GitHub's image storage (ghcr.io),
#              tagged with the commit
#   staging  — deploy-to.yml: migrations on the STAGING database, then the
#              staging API at https://<STAGING_API_DOMAIN>
#
# Production is never touched here. When staging looks right:
# Actions → "Promote to production" → "Run workflow" (promote.yml) puts the
# exact same images on production.
#
# OFF until the VPS is ready: set the repository variable DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables) and add the secrets
# listed in docs/deployment.md. Secrets are never printed in the logs.
# ============================================================================
name: Deploy to staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to deploy to staging (an older commit = rollback)'
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    # Only after a green CI run of a push to main (not a PR), or by hand — and
    # only once the deploy is switched on.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    strategy:
      # The 3 images are independent; build them side by side.
      matrix:
        image: [api, order-worker, notification-worker]
    env:
      IMAGE_PREFIX: ghcr.io/rahmanrafi0044/nowoll # ghcr.io names must be lowercase
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push (skipped if this commit's image already exists — e.g. a rollback)
        env:
          NAME: ${{ matrix.image }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="$IMAGE_PREFIX-$NAME"
          if docker manifest inspect "$IMAGE:$SHA" > /dev/null 2>&1; then
            echo "$IMAGE:$SHA already exists — not rebuilding."
            exit 0
          fi
          if [ "$NAME" = api ]; then
            args=(-f infrastructure/docker/api.Dockerfile)
          else
            args=(-f infrastructure/docker/worker.Dockerfile --build-arg "WORKER=$NAME")
          fi
          docker buildx create --use --name nowoll > /dev/null
          # The layer cache lives next to the images (":buildcache"), so an
          # unchanged lockfile doesn't download every package again.
          docker buildx build "${args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            -t "$IMAGE:$SHA" --push .

  staging:
    name: Staging
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-to.yml
    with:
      environment: staging
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit

  # Shown instead when the deploy is switched off, so it's clear why nothing happened.
  disabled:
    name: Deploy is switched off
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Deploy is off. When the VPS is ready, set the repository variable DEPLOY_ENABLED=true (docs/deployment.md)."
