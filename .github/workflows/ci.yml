# ============================================================================
# CI — runs on every pull request to main and every push to main.
#
# Two jobs, side by side, on GitHub's machines:
#   checks — formatting, types, lint, unit + API tests, database drift check
#   e2e    — the Playwright browser tests (tests/e2e) against the real apps
#
# No secrets: every test uses dummy values (CLAUDE.md Rule 3). The database is
# a throwaway Postgres container that exists only for the length of the job.
# The repo is private on GitHub's free plan, so branch protection isn't
# available: merges happen only when these checks are green (team rule).
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run (saves Actions minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same user/password as docker-compose.yml, so the test setup works unchanged.
  # (Prisma's config needs DATABASE_URL even just to generate code.)
  DATABASE_URL: postgresql://nowoll:nowoll_local_password@localhost:5432/nowoll_ci
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Checks (format, types, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowoll
          POSTGRES_PASSWORD: nowoll_local_password
          POSTGRES_DB: nowoll_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nowoll -d nowoll_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Catches the emails a test really sends (packages/email) — nothing leaves the machine.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting (Prettier)
        run: pnpm format:check

      # Rule 7: every schema.prisma change must come with a migration. Apply all
      # migrations to the empty database, then compare it with schema.prisma.
      - name: Database — migrations apply cleanly
        working-directory: packages/database
        run: pnpm exec prisma migrate deploy
      - name: Database — schema.prisma matches the migrations (drift check)
        working-directory: packages/database
        run: |
          if ! pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code; then
            echo "::error::schema.prisma has changes without a migration. Run: prisma migrate dev --name <what-changed>"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit + API tests
        run: pnpm test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowoll
          POSTGRES_PASSWORD: nowoll_local_password
          POSTGRES_DB: nowoll_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nowoll -d nowoll_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (+ its system libraries)
        run: pnpm --filter @nowoll/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      # On failure: the HTML report with a step-by-step trace of each failing
      # test. Download it from the run's "Artifacts" and open index.html.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
