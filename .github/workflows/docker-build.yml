# ============================================================================
# Docker check — step 47. On a PR that changes the Docker files, the production
# setup or the dependencies: build the 3 images (nothing is pushed), and check
# the compose file, the Nginx config and deploy.sh. Other PRs skip it, so they
# stay fast. The real build + deploy is deploy.yml.
# ============================================================================
name: Docker check

on:
  pull_request:
    branches: [main]
    paths:
      - infrastructure/**
      - .dockerignore
      - pnpm-lock.yaml
      - '**/package.json'
      - .github/workflows/docker-build.yml
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-to.yml
      - .github/workflows/promote.yml
      - apps/storefront/next.config.ts
      - apps/admin/next.config.ts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    name: Compose, Nginx and deploy.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The compose files are valid (app and edge)
        run: |
          {
            echo REDIS_PASSWORD=x
            echo "INTERNAL_API_KEY=$(openssl rand -hex 32)"
            echo SITE_DOMAIN=example.com
            echo ADMIN_DOMAIN=admin.example.com
            echo API_DOMAIN=api.example.com
            echo STAGING_SITE_DOMAIN=staging.example.com
            echo STAGING_ADMIN_DOMAIN=admin.staging.example.com
            echo STAGING_API_DOMAIN=api.staging.example.com
          } > ci.env
          NOWOLL_ENV_FILE="$PWD/ci.env" docker compose -f infrastructure/deployment/docker-compose.prod.yml --env-file ci.env config -q
          docker compose -f infrastructure/deployment/docker-compose.edge.yml --env-file ci.env config -q
      - name: deploy.sh passes shellcheck
        run: shellcheck infrastructure/deployment/deploy.sh
      - name: nginx -t (with a throwaway self-signed certificate)
        run: |
          mkdir -p le/live/nowoll
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=example.com \
            -keyout le/live/nowoll/privkey.pem -out le/live/nowoll/fullchain.pem 2> /dev/null
          touch htpasswd
          docker run --rm --env-file ci.env -e SITE_PASSWORD=on \
            -v "$PWD/infrastructure/nginx/nowoll.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/infrastructure/nginx:/etc/nginx/nowoll:ro" \
            -v "$PWD/htpasswd:/etc/nginx/htpasswd:ro" \
            -v "$PWD/le:/etc/letsencrypt:ro" \
            nginx:1.27.5-alpine sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Each image reports its own result: one failure doesn't cancel the others.
      fail-fast: false
      matrix:
        image: [api, order-worker, notification-worker, storefront, admin]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build (not pushed)
        env:
          NAME: ${{ matrix.image }}
        run: |
          case "$NAME" in
            api) docker build -f infrastructure/docker/api.Dockerfile -t "nowoll-$NAME:ci" . ;;
            storefront | admin)
              # Test addresses only — the real ones are baked in by deploy.yml.
              docker build -f infrastructure/docker/web.Dockerfile --build-arg "APP=$NAME" \
                --build-arg NEXT_PUBLIC_SITE_URL=https://example.com \
                --build-arg NEXT_PUBLIC_ADMIN_URL=https://admin.example.com \
                --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
                --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
                --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=public-test-key \
                -t "nowoll-$NAME:ci" . ;;
            *) docker build -f infrastructure/docker/worker.Dockerfile --build-arg "WORKER=$NAME" -t "nowoll-$NAME:ci" . ;;
          esac
      - name: Runs as non-root, with no .env files or keys inside
        env:
          NAME: ${{ matrix.image }}
        run: |
          user="$(docker run --rm --entrypoint id "nowoll-$NAME:ci" -un)"
          [ "$user" = node ] || { echo "::error::runs as $user"; exit 1; }
          found="$(docker run --rm --entrypoint sh "nowoll-$NAME:ci" -c \
            'find / -xdev \( -name ".env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" -o -name ".git" \) 2>/dev/null | grep -v /node_modules/ || true')"
          [ -z "$found" ] || { echo "::error::found in image: $found"; exit 1; }
          docker images "nowoll-$NAME:ci" --format 'Size: {{.Size}}'
      # Security audit (step 53): known vulnerabilities in the image. A CRITICAL
      # one that already has a fix fails the check (rebuild / update to get it);
      # HIGH ones are listed in the log to act on. Trivy runs as a container
      # (no third-party action), version pinned.
      - name: Vulnerability scan (Trivy)
        env:
          NAME: ${{ matrix.image }}
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
              image --quiet --ignore-unfixed "$@" "nowoll-$NAME:ci"
          }
          scan --severity HIGH,CRITICAL --exit-code 0
          scan --severity CRITICAL --exit-code 1
