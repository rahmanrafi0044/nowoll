# Security audit (step 53, docs/security-audit.md) — Dependabot checks every
# Monday and opens a PR when something has an update or a security fix:
#   npm            the packages in pnpm-lock.yaml (all apps, packages, workers)
#   github-actions the actions our workflows use (pinned to exact commits)
#   docker         the base image of our Dockerfiles (node:24-slim)
# Each PR runs the full CI like any other; merge only when it's green (and
# read what changed — an update is new code too).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Small updates arrive together in one PR; security fixes come on their own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule: { interval: weekly, day: monday }
