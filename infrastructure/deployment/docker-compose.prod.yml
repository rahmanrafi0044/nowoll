# ============================================================================
# Production on the Hostinger VPS — step 45 (guide: docs/deployment.md).
#   cd /opt/nowoll/app
#   docker compose -f infrastructure/deployment/docker-compose.prod.yml \
#     --env-file /opt/nowoll/.env up -d --build
#
# Only nginx is reachable from the internet (80/443). The API, the two
# workers and Redis talk on a private Docker network. The database is
# Supabase (not here); the shop and admin are on Vercel (not here).
# Every secret comes from /opt/nowoll/.env on the server — never from git.
# Migrations are NOT run here: CI runs `prisma migrate deploy` (step 47).
# Memory limits assume a 2–4 GB VPS (adjust if the plan differs).
# ============================================================================

name: nowoll

x-common: &common
  restart: unless-stopped
  env_file: ${NOWOLL_ENV_FILE:-/opt/nowoll/.env}
  networks: [backend]
  # Logs can't fill the disk: at most 3 files of 10 MB per service.
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-app-env: &app-env
  NODE_ENV: production
  # Redis on the private network, with its password.
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in /opt/nowoll/.env}@redis:6379

services:
  api:
    <<: *common
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: nowoll-api:latest
    environment:
      <<: *app-env
      PORT: '3001'
    depends_on:
      redis: { condition: service_healthy }
    # The app can't change its own files; only /tmp is writable.
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 512m }

  order-worker:
    <<: *common
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
      args: { WORKER: order-worker }
    image: nowoll-order-worker:latest
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256m }

  notification-worker:
    <<: *common
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
      args: { WORKER: notification-worker }
    image: nowoll-notification-worker:latest
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256m }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    # Password required; saved to disk (appendonly) so queued jobs survive a
    # restart; "noeviction" because BullMQ must never lose a job to free memory.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in /opt/nowoll/.env}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 128m }
    # No ports: Redis is never reachable from outside.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    ports: ['80:80', '443:443']
    environment:
      # Filled into nowoll.conf.template when nginx starts.
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in /opt/nowoll/.env, e.g. api.nowoll.com}
    volumes:
      # Mounted as default.conf so it REPLACES the image's stock "Welcome to nginx" site.
      - ../nginx/nowoll.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 64m }

  # Renews the HTTPS certificate twice a day when it's close to expiry
  # (the first certificate and the nginx reload: step 49, docs/deployment.md).
  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    networks: [backend]
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }

networks:
  backend:

volumes:
  redis_data:
  letsencrypt:
  certbot_www:
