# ============================================================================
# The APP on the Hostinger VPS — steps 45, 47 and 48 (guide: docs/deployment.md):
# the shop, the admin panel, the API, the two workers and their own Redis.
#
# The SAME file runs twice, side by side (deploy.sh picks which):
#   production  project "nowoll-production"  settings /opt/nowoll/.env
#   staging     project "nowoll-staging"     settings /opt/nowoll-staging/.env
# Each has its own Redis and private network, and its own database (Supabase).
# Nginx (docker-compose.edge.yml) is shared: it reaches each API through the
# "edge" network as api-production / api-staging.
#
# Only nginx is reachable from the internet (80/443). The shop and admin are on
# Vercel (not here). Every secret comes from the .env on the server — never git.
# Migrations are NOT run here: the Deploy workflow runs `prisma migrate deploy`.
# Images: CI builds them; deploy.sh sets IMAGE_PREFIX (ghcr.io/<owner>/nowoll)
# and IMAGE_TAG (the git commit). Without them: local images nowoll-*:latest.
# Memory: both copies + nginx use ~2 GB at rest — an 8 GB VPS (Hostinger KVM 2) has room.
# ============================================================================

# A distinct name, never plain "nowoll": that is the local dev setup (docker-compose.yml),
# and --remove-orphans would delete its containers.
name: nowoll-production

x-common: &common
  restart: unless-stopped
  env_file: ${NOWOLL_ENV_FILE:-/opt/nowoll/.env}
  networks: [backend]
  # Logs can't fill the disk: at most 3 files of 10 MB per service.
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-app-env: &app-env
  NODE_ENV: production
  # Redis on the private network, with its password.
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the .env}@redis:6379

services:
  api:
    <<: *common
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: ${IMAGE_PREFIX:-nowoll}-api:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      PORT: '3001'
    networks:
      backend: {}
      # Nginx finds this API by this name (production or staging).
      edge:
        aliases: ['api-${DEPLOY_ENV:-production}']
    depends_on:
      redis: { condition: service_healthy }
    # The app can't change its own files; only /tmp is writable.
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 512m }

  order-worker:
    <<: *common
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
      args: { WORKER: order-worker }
    image: ${IMAGE_PREFIX:-nowoll}-order-worker:${IMAGE_TAG:-latest}
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256m }

  notification-worker:
    <<: *common
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
      args: { WORKER: notification-worker }
    image: ${IMAGE_PREFIX:-nowoll}-notification-worker:${IMAGE_TAG:-latest}
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256m }

  # ── The shop and the admin panel (step 48) ──────────────────────────────
  # Images from web.Dockerfile, one per environment (their public addresses
  # are baked in at build time). NOT given the .env file: they only need the
  # few server settings below — never database, payment or email secrets.
  # Writable: only their page/photo cache inside the image (see web.Dockerfile).
  storefront:
    image: ${IMAGE_PREFIX:-nowoll}-storefront-${DEPLOY_ENV:-production}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    environment:
      # Page data from the API over the private network (fast; see
      # apps/storefront/src/lib/server-env.ts), with the shared secret so the
      # shop's own page builds aren't counted as one huge visitor.
      API_INTERNAL_URL: http://api:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the .env (openssl rand -hex 32)}
      COOKIE_PREFIX: ${COOKIE_PREFIX:-nw}
    networks:
      backend: {}
      edge:
        aliases: ['storefront-${DEPLOY_ENV:-production}']
    depends_on:
      api: { condition: service_healthy }
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 384m }

  admin:
    image: ${IMAGE_PREFIX:-nowoll}-admin-${DEPLOY_ENV:-production}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    environment:
      COOKIE_PREFIX: ${COOKIE_PREFIX:-nw}
    # The admin talks to the API only from the browser — no private network needed.
    networks:
      edge:
        aliases: ['admin-${DEPLOY_ENV:-production}']
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256m }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    # Password required; saved to disk (appendonly) so queued jobs survive a
    # restart; "noeviction" because BullMQ must never lose a job to free memory.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the .env}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 128m }
    # No ports: Redis is never reachable from outside.

networks:
  backend:
  # Shared with nginx (created by deploy.sh: docker network create nowoll_edge).
  edge:
    name: nowoll_edge
    external: true

volumes:
  redis_data:
