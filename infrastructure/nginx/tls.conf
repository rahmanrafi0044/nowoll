# Shared HTTPS settings for every Nowoll address (included by nowoll.conf.template).
# ONE certificate covers all the names (step 49). It's created with
# `certbot --cert-name nowoll`, so its folder is always live/nowoll — the same
# whatever the domains are.
ssl_certificate     /etc/letsencrypt/live/nowoll/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/nowoll/privkey.pem;
# Modern TLS only (Mozilla "intermediate" settings).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
